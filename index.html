<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Visualizer Basics</title>
    <link rel="stylesheet" href="styles.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
</head>
<body>

    <header>
        <div class="header-container">
            <h1><a href="index.html" style="text-decoration: none; color:inherit;">JS Visualizer</a><span class="badge">Basics</span>
            <p style="font-size:12px; color:gray;">JavaScript Visualizer Basics Tool </p>
            </h1>
        </div>
    </header>

    <main class="tutor-grid">
        <div class="panel-column left-panel">
            <div class="panel-card">
                <div class="card-header">JavaScript Code</div>
                <div class="code-wrapper">
                    <textarea id="codeEditor">let name = "Anis";
let scores = [95, 88, 100];
let user = { id: 7, active: true };

for (let i = 0; i < scores.length; i++) {
    console.log("Score at index " + i + " is: " + scores[i]);
}</textarea>
                </div>
                <button id="btnVisualize" class="btn btn-primary">Visualize</button>
                
                <div class="navigation-cluster">
                    <button id="btnFirst" class="btn btn-nav" disabled>|◄ First</button>
                    <button id="btnPrev" class="btn btn-nav" disabled>◄ Prev</button>
                    <span id="stepCounter">Step: 0 / 0</span>
                    <button id="btnNext" class="btn btn-nav" disabled>Next ►</button>
                    <button id="btnLast" class="btn btn-nav" disabled>Last ►|</button>
                </div>
            </div>

            <div class="panel-card">
                <div class="card-header">Console Output</div>
                <div id="consoleOutput" class="console-box"></div>
            </div>
        </div>

        <div class="panel-column right-panel">
            <div class="panel-card spec-card">
                <div class="card-header">Stack & Object</div>
                
                <div class="memory-grid-workspace">
                    <div class="memory-block stack-segment">
                        <h3>Stack</h3>
                        <div id="stackRoot" class="frame-container">
                            <div class="placeholder-msg">Stack uninitialized</div>
                        </div>
                    </div>

                    <div class="memory-block heap-segment">
                        <h3>Object</h3>
                        <div id="heapRoot" class="heap-container">
                            <div class="placeholder-msg">Object unallocated</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="smart-footer">
        <div class="footer-container">
            <div class="footer-left">
                <p class="copyright-text"><a href="https://www.grameenphone.academy/public-profile/GP153876" target="_blank" style="text-decoration:none; color:inherit;" >👤 <span class="brand-highlight">Md. Anisur Rahman</a></span>. All Rights Reserved.</p>
            </div>
            <div class="footer-right">
                <a href="https://github.com/AnisurRahmanJU/JS-Visualizer-Bascis/blob/main/example.md" target="_blank" class="footer-link">
                    <i class="fa-solid fa-code footer-icon"></i> Code Example
                </a>
                <a href="https://github.com/AnisurRahmanJU/JS-Visualizer-Bascis/" target="_blank" class="footer-link-btn">
                    <i class="fa-brands fa-github footer-icon"></i> GitHub Repository
                </a>
            </div>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
